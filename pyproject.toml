[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-spine-med"
version = "0.1.0"
description = "Research preparation and SpineNet baseline for lumbar central canal stenosis"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=1.26,<2",
  "pandas>=2.2,<3",
  "pydicom>=3.0,<4",
  "scipy>=1.12,<2",
  "scikit-learn>=1.5,<2",
  "scikit-image>=0.24,<1",
  "opencv-python-headless>=4.10,<4.12",
  "shapely>=2.0,<3",
  "matplotlib>=3.9,<4",
  "torch>=2.6,<3",
  "torchvision>=0.21,<1",
  "requests>=2.32,<3",
  "tqdm>=4.66,<5",
  "typing-extensions>=4.12",
]

[project.optional-dependencies]
data = ["kaggle>=2.2.4,<3"]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.scripts]
ai-spine = "ai_spine_med.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ai_spine_med = ["assets.lock.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
