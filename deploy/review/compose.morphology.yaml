services:
  review:
    image: ai-spine-review:disc-v17
    environment:
      REVIEW_ANALYSIS_MODULES: '{"disc_morphology":{"enabled":true,"python":"/opt/disc-cli/bin/python","model_home":"/disc-models","device":"cpu","threads":1,"timeout_seconds":900}}'
    volumes:
      - ./disc-models:/disc-models:ro

