server {
    listen 80;
    server_name 185.65.200.171;

    root /var/www/spine-psp-public;
    absolute_redirect off;
    autoindex off;

    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Cache-Control no-store always;

    location = /demo {
        return 308 /demo/;
    }

    location = /demo/ {
        limit_except GET { deny all; }
        try_files /demo/index.html =404;
    }

    location ~ ^/demo/demo\.(?:css|js|json)$ {
        limit_except GET { deny all; }
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
