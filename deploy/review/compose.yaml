services:
  review:
    image: ai-spine-review:v13
    container_name: ai-spine-review-v13
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:8768:8768"
    env_file: ./review.env
    environment:
      REVIEW_ROOT: /review
      REVIEW_UPLOAD_ROOT: /uploads
      REVIEW_MODEL_CACHE: /models/cache
      REVIEW_INFERENCE_HEADS: '["/models/heads/runs/seed-42/head.pt", "/models/heads/runs/seed-2024/head.pt", "/models/heads/runs/seed-3407/head.pt"]'
      REVIEW_INFERENCE_DEVICE: cpu
      REVIEW_INFERENCE_THREADS: "1"
    volumes:
      - ./package:/review:ro
      - ./models:/models:ro
      - ./uploads:/uploads
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    mem_limit: 3500m
    memswap_limit: 5g
    cpus: 2
    pids_limit: 128
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options:
        max-size: 2m
        max-file: "2"
